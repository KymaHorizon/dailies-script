[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dailies"
version = "0.1.0"
description = "Command-line dailies pipeline for RED R3D and ProRes sources: scan, sync, grade and render, with a verbatim command log and a dry run for every stage"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kyma Horizon Ltd" }]
requires-python = ">=3.11"
keywords = ["dailies", "DIT", "data management", "RED", "R3D", "ProRes", "ASC MHL", "ASC CDL", "OpenColorIO", "FFmpeg", "Avid", "DNxHR"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/KymaHorizon/dailies-script"
Source = "https://github.com/KymaHorizon/dailies-script"
Issues = "https://github.com/KymaHorizon/dailies-script/issues"

[project.optional-dependencies]
# Each extra is needed only by the stage that uses it.
aaf = ["pyaaf2>=1.6"]
mhl = ["ascmhl"]
colour = ["opencolorio>=2.3"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
dailies = "dailies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
